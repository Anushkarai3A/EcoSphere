name: ecosphere

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecosphere
    ports:
      # Host 5433 avoids colliding with a locally installed PostgreSQL service.
      # Containers still reach the database internally at db:5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecosphere"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: &api-env
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ecosphere?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      # Local stack is served over plain http, so the refresh cookie must not be Secure.
      COOKIE_SECURE: "false"
      CORS_ORIGIN: http://localhost:8080
      # Exactly one hop: the bundled nginx web container proxies to api.
      TRUST_PROXY_HOPS: 1
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-ai-token}
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Bind to loopback so clients cannot bypass nginx and spoof X-Forwarded-For.
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads:/app/uploads
    # Apply migrations before booting (idempotent).
    command: ["sh", "-c", "npx prisma migrate deploy --schema ../database/prisma/schema.prisma && node dist/server.js"]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/worker/index.js"]

  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Local provider credentials live in the AI service's own ignored .env.
    # Do not set AI_GROQ_API_KEY here: an empty Compose override would mask it.
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      # Production mode rejects the default shared secret at startup.
      AI_ENVIRONMENT: production
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-ai-token}
      AI_MODEL_PATH: models/yolov8n.pt

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
